# 2단계 검색 쿼리 사전 v0.2 (사람 검수 반영, 2026-11-14)
# - v0.2 변경: 검수 81행 판정 반영. 영역 핵심어는 주거 [주거], 교육훈련 [학습], 미취업(구직) [취업, 일자리, 구직], 미래설계 [진로]만 남기고
#   나머지 핵심어는 조건부 확장어로 옮김(건강, 경제, 관계참여, 노동(일하는 중), 일상·여가의 core는 빈 목록).
# - core가 비어 있는 영역은 쿼리 빌더의 label_plain 대체 토큰(BM25 fallback)을 쓴다.
# - 조건부 확장은 영역이 확정되고 일상어 패턴이 일치할 때만 적용한다. 패턴은 부분문자열, block_if는 패턴 뒤 12자 안에서만 확인한다.
# - 병합: T035+T071(근로자), T037+T072(임금), T021+T061(자조모임), T025+T064(수강), T014+T069+T017(체육, 스포츠), T048+T050(임차료, 임대료).
# - 제외: 미래설계 핵심어 자립, 자산, 저축, 목돈과 미래설계 확장 진로, 자립. 아래 removed에 사유를 남김(쿼리 빌더는 읽지 않음).
# - 노동(일하는 중): 근로자, 임금, 산재는 명시적 표현에서만 적용. 회사, 직장, 재직, 사장, 야근 언급만으로는 적용하지 않음. 재직은 보류 후보.
# - T056 긴급은 긴급생계비로 구체화. T060 심리상담은 Dense 전용 확장(bm25_allowed: false). 상담 hold 정책(T081)은 그대로.
# - T076 acc_online_use 패턴에서 소통 방식 표현(문자로, 메시지로, 채팅, 카톡, 앱으로)과 재택을 뺌.
# - 후보는 ai/eval/build_query_terms_candidates.py로 뽑았다. 자료는 dev_corpus label evidence와 services_master뿐. Q3 질의 쌍과 평가 페르소나 카드는 쓰지 않았다.
# - evidence_level: 개발 근거 있음 / 근거 약함 / 개발 근거 없음(마스터 근거) / 검증 불가(노동 라벨 없음).
#   dev_hits는 dev_corpus 300건에서 패턴이 (block_if 적용 후) 걸린 기록 수, dev_hits_target은 그중 해당 영역 라벨이 있는 기록 수.
# - master_count: 서비스명 + 요약 + 지원내용 부분문자열 출현 서비스 수(--check-yaml 결과). apply_text_count: 신청방법 칸.
# - 사전 토큰에서 banned_terms, hold_terms는 쿼리 빌더가 뺀다.
# - candidates: 검토했지만 add_terms에 넣지 않은 후보와 판단 사유. 쿼리에 쓰지 않는다.
# - 확장은 이미 확정된 영역 안에서만 쓴다. 확장으로 새 영역을 만들지 않는다.
# - 상한(main_core 등)은 config.yaml stage2.query.caps. 근거 없는 초기값. 확장어 상한은 단어 수 기준이라 같은 트리거가 겹치면 앞 항목이 먼저 채워진다.
version: "0.2"
status: 검수 반영

