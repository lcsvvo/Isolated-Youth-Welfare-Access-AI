    source: services_master 문구 출현 + dev_corpus label evidence (미래설계 27건, 진로 9건)
    limitation: 마스터 app_domain 해당 서비스 0건. 영역 라벨 기반 검증 불가. 진로 탐색과 방향 설정 중심이며 자산, 저축, 목돈, 자립은 제외(검수)
    review: 검수 반영(2026-11-14)
  경제:
