# 접근 의도(want): 사용자가 원한다고 쓴 방식. patterns + want_markers가 같은 문장에 있고 block_if가 없을 때만.
# block_if는 같은 절에서 12자 안에 시작하는 표현을 확인함. '싫지 않아요'처럼 취소된 단서는 제외함.
# bm25_allowed: false면 Dense 문장에만 쓴다(Kiwi가 '방문'·'대면' 토큰을 만드는 표현).
# main_path: C면 쿼리보다 규칙 전달(access 필드)이 주 경로. 신청 방법 표현은 검색 칸에 따라 BM25 효과가 작을 수 있음.
want_markers: [싶, 좋겠, 있나, 있을까, 있는지, 가능, 방법, 원해, 원합, 해주, 해 주, 받을 수, 할 수, 할수, 되나, 될까, 주세요]
access_terms:
  - id: acc_video
    polarity: want
    scope: 이용
    patterns: [화상, 영상통화, 영상으로]
    positive_terms: [화상]
    bm25_allowed: true
    dense_phrase: 화상으로 이용할 수 있는 서비스를 원합니다.
    block_if: [싫, 부담, 무서, 말고, 못]
    main_path: query
    evidence: {master_count: {화상: 14}, example_servIds: [WLF00000086, WLF00003236, WLF00006295]}
    source_rows: [T073]
    review: 검수 반영(2026-11-14)
  - id: acc_outreach
    polarity: want
    scope: 이용
    patterns: [집으로 와, 집에 와, 찾아와, 찾아오, 와 주, 와주]
    positive_terms: [찾아가는]
    bm25_allowed: true
    dense_phrase: 집으로 찾아오는 서비스를 원합니다.
    block_if: [싫, 부담, 무서, 말고]
    main_path: query
    evidence: {master_count: {찾아가는: 30}, example_servIds: [WLF00000071, WLF00001141, WLF00003200]}
    source_rows: [T074]
    review: 검수 반영(2026-11-14)
  - id: acc_home_visit
    polarity: want
    scope: 이용
    patterns: [가정방문, 집으로 와, 찾아와]
    positive_terms: [가정방문]
    bm25_allowed: false
    dense_phrase: 가정방문으로 받을 수 있는 서비스를 원합니다.
    block_if: [싫, 부담, 무서, 말고]
    main_path: query
    evidence: {master_count: {가정방문: 21}, example_servIds: [WLF00000807, WLF00003283, WLF00006287]}
    source_rows: [T075]
    review: 검수 반영(2026-11-14)
  - id: acc_online_use
    polarity: want
    scope: 이용
    patterns: [온라인으로, 인터넷으로, 비대면]
    positive_terms: [온라인]
    bm25_allowed: true
    dense_phrase: 온라인으로 이용할 수 있는 서비스를 원합니다.
    block_if: [싫, 부담, 무서, 말고, 못]
    main_path: query
    evidence: {master_count: {온라인: 25}, apply_text_count: {온라인: 395}, example_servIds: [WLF00000086, WLF00000781, WLF00001083]}
    note: 소통 방식 요청(문자, 메시지, 채팅, 카톡, 앱으로)과 상태 서술(재택)은 온라인 이용 요청이 아니어서 패턴에서 뺌(T076). 소통 방식은 별도 접근 신호로 검토
    source_rows: [T076]
    review: 검수 반영(2026-11-14)
  - id: acc_apply_online
    polarity: want
    scope: 신청
    patterns: [집에서 신청, 온라인으로 신청, 온라인 신청, 인터넷으로 신청, 인터넷 신청, 비대면 신청, 가지 않고 신청, 안 가고 신청]
    positive_terms: [온라인]
    bm25_allowed: true
    dense_phrase: 온라인으로 신청할 수 있는 서비스를 원합니다.
    block_if: [싫, 어렵, 못]
    main_path: C
    evidence: {master_count: {온라인: 25}, apply_text_count: {온라인: 395}, example_servIds: [WLF00000086, WLF00000781, WLF00001083]}
    source_rows: [T077]
    review: 검수 반영(2026-11-14)

# B2(실험용): 회피 제약 채널에서 추론하는 접근 id. 운영 기본값 아님.
# 사용자가 요청한 접근이 아니므로 쿼리 결과의 access_inferred에 따로 두고 access에는 넣지 않는다.
avoid_derived:
  방문: [acc_apply_online, acc_outreach]
  전화: [acc_online_use]

banned_terms: [재가, 지원]
hold_terms: [생계, 상담]
