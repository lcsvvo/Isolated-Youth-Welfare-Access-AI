# 검수에서 제외된 항목. 쿼리 빌더는 읽지 않는다(이력 보존용).
removed:
  - {term: 자립, row_id: T040, from: "core:미래설계", reason: "범위가 넓고(주거안정, 경제적 자립 등) 진로 탐색을 직접 의미하지 않음"}
  - {term: 자산, row_id: T041, from: "core:미래설계", reason: "자격 기준, 자산형성 표현으로 미래설계에 부적절. 경제 조건부 확장 후보로 별도 관리(Q1 팀 합의 전 미사용)"}
  - {term: 저축, row_id: T042, from: "core:미래설계", reason: "경제적 자산형성 관련. 미래설계에서 제외, 경제 조건부 확장 후보로 별도 관리(Q1 팀 합의 전 미사용)"}
  - {term: 목돈, row_id: T043, from: "core:미래설계", reason: "금융, 자산형성 목적이며 진로설계와 다름. 경제 조건부 확장 후보로 별도 관리(Q1 팀 합의 전 미사용)"}
  - {term: 진로, row_id: T067, from: "expansion:exp_future_path", reason: "T039 핵심어 진로와 중복 확장이라 확장 규칙만 제외(핵심어 진로는 유지). 막막, 앞으로 단독을 진로 욕구로 단정하지 않음"}
  - {term: 자립, row_id: T068, from: "expansion:exp_future_path", reason: "경제, 주거, 돌봄 등 지원 목적이 넓어 진로 탐색과 일치하지 않음(T040과 일관)"}

