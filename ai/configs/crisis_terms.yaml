# 0단계 위기 확인 1차 키워드. 하나라도 들어 있으면 위기로 보고 LLM 판정 없이 추천을 멈춘다.
# 매칭: 입력과 키워드 모두 공백을 지운 뒤 포함 여부를 본다 ("사라지고 싶" = "사라지고싶").
# 재현율 우선. 키워드에 걸리지 않은 문장은 LLM이 한 번 더 본다 (safety/crisis.py).
# 근거: 말뭉치 유형 10(위기 신호형) 사람 검수 문장, 합의안 221·251번 별도 감지 메모.
# exclude: 공백을 지우면 우연히 키워드가 되는 말 ("혼자 살면서" → "자살"). 매칭 전에 지운다.
# 추가(2차): 죽어버릴까·목숨을끊·눈을안떴으면·살아있는의미·사는의미 (규칙 탐지 누락 표현 보강, 재현율 우선).
# 추가(3차): 사라졌으면 (개발 카드 C10-12 키워드 누락, crisis_v3).
# 직접 표현만 둔다. 방법·도구·시점 표현은 적지 않는다.
terms:
  # 죽음·자해 직접 언급
  - 죽고싶
  - 죽어버리고
  - 죽어버릴까
  - 목숨을끊
  - 자살
  - 자해
  # 소멸·부재 희망
  - 사라지고싶
  - 사라지면편할
  - 사라지면좋
  - 사라져버리고
  - 사라져도
  - 사라졌으면
  - 없어지고싶
  - 없어져도
  - 없어지는게
  - 없어졌으면
  - 없는게나을
  - 없었으면좋았
  - 내가없으면
  - 제가없으면
  - 안깨어났으면
  - 깨어나지않았으면
  - 눈을안떴으면
  - 눈을뜨지않았으면
  - 내일이안왔으면
  - 다끝났으면
  - 끝내고싶
  # 삶의 의미·지속 포기
  - 살기싫
  - 살고싶지않
  - 살아갈자신이없
  - 살아도의미없
  - 살아가는이유
  - 살아있는것자체가
  - 살아있는게왜
  - 살아있는의미
  - 사는의미
  - 사는게왜이렇게
  - 사는게무슨소용
  - 버티는이유
  - 더는못버티
  - 더이상못버티
  - 다포기하고싶
  - 다놓아버리고싶
  - 다내려놓고
  - 다그만두고싶
  - 필요없는사람
  - 짐만되는
  - 나쁜생각
  - 희망이하나도없
  - 아무런희망
